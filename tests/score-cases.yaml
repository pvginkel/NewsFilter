  title: 'Box 3 splijt coalitie: VVD wil snelle invoering winstbelasting op vermogen'
  summary: "<p>De coalitie stevent af op een groot conflict over de belasting op vermogen\
    \ (box 3). Uit stukken van het ministerie van Financiën, die in handen van de NOS zijn,\
    \ blijkt dat snelle invoering van de vermogenswinstbelasting toch nog een optie is. De\
    \ VVD is vastbesloten om zo'n belasting nog voor het einde van het jaar voor aandelen\
    \ in te voeren, maar coalitiegenoten CDA en D66 zien dit niet zitten.</p>\n        <p>Met\
    \ deze nog geheime stukken in de hand was minister Heinen van Financiën (VVD) de afgelopen\
    \ weken een heel eind op weg om met JA21 en SGP een begrotingsdeal te sluiten. Ook deze\
    \ partijen willen voor aandelen vanaf 2028 een vermogenswinstbelasting invoeren, wat betekent\
    \ dat de schatkist komende jaren miljarden minder binnenkrijgt.</p>\n        <p>Bij een\
    \ volledige vermogenswinstbelasting komt er in totaal tussen de 11 en 25 miljard euro\
    \ minder binnen. Dat komt onder meer doordat de belasting pas wordt geïnd als bijvoorbeeld\
    \ aandelen worden verkocht.</p>\n        <h2>Onderhandelingen liepen hoog op</h2>\n  \
    \      <p>Heinen werd teruggefloten door D66 en CDA. Zij zien geen politiek draagvlak\
    \ om miljarden voor vermogenden vrij te maken, terwijl er bezuinigd wordt op de sociale\
    \ zekerheid. De twee partijen willen de steun van oppositiepartij Pro niet verliezen,\
    \ die in de onderhandelingen als eis stelt de belasting op vermogens juist te verhogen.</p>\n\
    \        <p>De begrotingsonderhandelingen tussen D66, VVD en CDA liepen hierdoor hoog\
    \ op. De partijen konden het niet eens worden en besloten daarom na lange gesprekken het\
    \ onderwerp box 3 <a href=\"https://nos.nl/artikel/2629305-onduidelijkheid-over-box-3-blijft-coalitie-wil-wetsvoorstel-vooruitschuiven\"\
    >te parkeren</a>.</p>\n        <p>De coalitiepartijen hebben verschillende lezingen over\
    \ wat er nu precies is afgesproken. Enerzijds is te horen dat een besluit erover is geparkeerd.\
    \ Maar minister Heinen zei vandaag alsnog versneld de vermogenswinstbelasting te willen\
    \ invoeren: \"Het kan\" en \"Ik ben er wel al uit\", zei hij bij de ministerraad. D66-staatssecretaris\
    \ Eerenberg (Fiscaliteit) moet de hervormingen rond box 3 doorvoeren.</p>\n        <h2>Verschil\
    \ tussen vermogenswinstbelasting en vermogensaanwasbelasting</h2>\n        <p>Bij vermogensaanwasbelasting\
    \ betaal je elk jaar over de winst die je hebt gemaakt, ook als die winst nog 'vastzit'\
    \ in bijvoorbeeld aandelen.</p>\n        <p>Bij vermogenswinstbelasting betaal je pas\
    \ op het moment dat je bijvoorbeeld je aandelen of cryptomunten verkoopt.</p>\n      \
    \  <p>Afgelopen jaren zeiden opeenvolgende bewindslieden dat het niet mogelijk was om\
    \ op korte termijn de vermogenswinstbelasting in te voeren. Maar volgens inschattingen\
    \ van ambtenaren van Financiën zou het in theorie dus toch nog wel kunnen. De Eerste en\
    \ Tweede Kamer moeten dan wel voor het einde van het jaar instemmen met dit plan, is in\
    \ de stukken te lezen.</p>\n        <p>Ambtenaren waarschuwen ook voor nadelen: de Belastingdienst\
    \ kan bijvoorbeeld in het eerste jaar, maar mogelijk langer, de belastingaangiftes nauwelijks\
    \ controleren omdat de systemen nog niet op orde zijn.</p>\n        <p>JA21 voert intussen\
    \ de druk op het kabinet op. De partij wil alleen nog een begrotingsdeal sluiten als de\
    \ vermogensbelasting op korte termijn wordt ingevoerd. \"Wat ons betreft is vermogensaanwas\
    \ een gepasseerd station\", zegt JA21-Kamerlid Michiel Hoogeveen. \"Het is een fundamenteel\
    \ oneerlijk systeem.\"</p>\n        <h2>Box 3 is hoofdpijndossier</h2>\n        <p>Box\
    \ 3 is een hoofdpijndossier voor de politiek, sinds de Hoge Raad eind 2021 <a href=\"\
    https://nos.nl/artikel/2410757-hoge-raad-spaartaks-in-strijd-met-de-wet\">een streep zette</a>\
    \ door de manier waarop de Belastingdienst de hoogte van de belasting berekende.</p>\n\
    \        <p>Daarom is er op dit moment <a href=\"https://nos.nl/artikel/2604462-belastingaangifte-kan-weer-nu-ook-meteen-werkelijk-rendement-doorgeven\"\
    >een tijdelijk systeem</a>, dat vooral voor mensen met hoge rendementen voordelig is.\
    \ De schatkist krijgt daardoor nu al jaarlijks zeker 2,4 miljard euro minder binnen.</p>\n\
    \        <p>Er is een politieke meerderheid voor de invoering van een vermogenswinstbelasting,\
    \ alleen was dat volgens opeenvolgende bewindslieden dus niet op kort termijn mogelijk.\
    \ De afgelopen jaren discussieerde de politiek daarom over de vraag: wat doe je in de\
    \ tussentijd?</p>\n        <p>De Tweede Kamer stemde met tegenzin in met de invoering\
    \ van een tijdelijk compromis: over het rendement op spaargeld en beleggingen betaal je\
    \ elk jaar belasting (vermogensaanwasbelasting), terwijl je op een tweede woning of aandelen\
    \ in startende ondernemingen pas bij verkoop afrekent.</p>\n        <p>CDA en VVD stemden\
    \ in de Tweede Kamer ook voor dit plan, maar kregen na een storm van kritiek uit de achterban\
    \ grote twijfels. In de Eerste Kamer steunen ze het voorstel niet meer en is nu <a href=\"\
    https://nos.nl/artikel/2621107-eerste-kamer-stelt-stemming-over-box-3-voorlopig-uit-nieuw-voorstel-beloofd\"\
    >een meerderheid uit zicht</a>.</p>\n        <h2>FNV: redelijk bizar</h2>\n        <p>Coalitiepartijen\
    \ D66, VVD en CDA zijn het over één ding wel eens: dat de vakbonden en werkgevers betrokken\
    \ moeten worden in het probleem rond box 3. Het idee is dat er dan in één keer een grote\
    \ deal gesloten kan worden over box 3 en de sociale zekerheid. Maar de bonden en werkgevers\
    \ zeggen nog van niets te weten.</p>\n        <p>Werkgeversorganisatie VNO-NCW zegt verrast\
    \ te zijn. Vakbond FNV noemt het \"redelijk bizar\" dat het kabinet hiervoor naar de polder\
    \ wijst. \"Het is aan het kabinet om dit verder uit te werken\", zegt een woordvoerder.\
    \ \"Voor ons is daarbij één ding helder: die begroting mag niet ten koste gaan van de\
    \ sociale zekerheid. Dat zullen we niet accepteren.\"</p>"
