  title: Onderzoek NVWA naar ingevoerde dieren na mond-en-klauwzeer-uitbraak Duitsland
  summary: '<p>De Nederlandse Voedsel- en Warenautoriteit (NVWA) onderzoekt of er dieren zijn
    geïmporteerd uit het gebied in Duitsland waar mond-en-klauwzeer (MKZ) is opgedoken. Dat
    schrijft minister Wiersma van Landbouw in een Kamerbrief.</p>

    <p>Vandaag werd duidelijk dat er in Duitsland voor het eerst sinds tientallen jaren MKZ
    is vastgesteld. Op een boerderij in de plaats Hönow, zo''n twintig kilometer van Berlijn
    in de deelstaat Brandenburg, zijn drie waterbuffels doodgegaan als gevolg van de ziekte.</p>

    <p>Minister Wiersma zegt dat de NVWA meteen vandaag heeft gekeken of er dieren rechtstreeks
    vanuit dat gebied naar Nederland zijn verplaatst. Dat lijkt niet het geval te zijn, maar
    er zijn volgens haar wel signalen dat er mogelijk indirect dieren uit die omgeving zijn
    ingevoerd. Als dat inderdaad zo is, worden de bedrijven in Nederland die de dieren hebben
    geïmporteerd geblokkeerd en verder onderzocht.</p>

    <h2>Blauwtongmonsters</h2>

    <p>Wiersma vraagt ook het onderzoekscentrum Wageningen Bioveterinary Research om nog eens
    onderzoek te doen naar negatieve monsters van het blauwtongvirus die afgelopen tijd werden
    ingestuurd. Die worden dan getest op het MKZ-virus. Verder is de Deskundigengroep Dierziekten
    om een advies gevraagd over de risico''s van de uitbraak.</p>

    <p>De minister spreekt verder van een "verrassende en zeer teleurstellende gebeurtenis"
    en wijst erop dat in 2007 voor het laatst een besmetting met het virus werd vastgesteld
    in een EU-lidstaat.</p>

    <h2>Zeer besmettelijk</h2>

    <p>Mond-en-klauwzeer is een zeer besmettelijke virusziekte bij dieren als koeien, schapen
    en geiten. Het virus kan zich snel en op verschillende manieren verspreiden. Onder meer
    via melk, mest en urine van besmette dieren, via de lucht en via mensen, dieren en materialen
    die met besmette dieren in aanraking zijn gekomen.</p>'
