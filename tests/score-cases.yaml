  title: Oproep om binnen te blijven in Overasselt vervallen na dag met 'on-Nederlands' geweld
  summary: "<p>De oproep aan de inwoners van Overasselt om binnen te blijven, is ingetrokken.\
    \ De politie zegt dat er geen aanwijzingen zijn dat zich nog verdachten in of rond het\
    \ dorp schuilhouden.</p>\n        <p>Wel blijft de oproep van kracht om meteen 112 te\
    \ bellen als inwoners een verdachte situatie zien. Vannacht is in het gebied verscherpt\
    \ toezicht. Er wordt extra gesurveilleerd door de politie. Bij daglicht gaat het onderzoek\
    \ verder.</p>\n        <p>Agenten hebben in de avond tussen Overasselt en Nederasselt\
    \ gezocht naar leden van de gewapende groep die de afgelopen nacht onderweg was naar een\
    \ boerderij net buiten het dorp. Daar werd een man van 51 uit Wijchen doodgeschoten. Later\
    \ werd ook op de politie geschoten.</p>\n        <p>De burgemeester van de gemeente Heumen,\
    \ het Openbaar Ministerie en de politie gaven aan het eind van de middag een overzicht\
    \ van wat er afgelopen nacht gebeurd was. Burgemeester Minses noemde die gebeurtenissen\
    \ \"on-Nederlands\".</p>\n        <h2>Bewakingscamera's</h2>\n        <p>Om 04.00 uur\
    \ verschenen twee busjes op de Ewijkseweg, zo blijkt uit beelden van bewakingscamera's.\
    \ Er kwamen tientallen gemaskerde mannen uit, een aantal van hen had zware vuurwapens\
    \ bij zich.</p>\n        <p>Ze liepen in de richting van de boerderij waar een familie\
    \ woont die met drugshandel in verband wordt gebracht. Kort daarna hielden ze halt bij\
    \ een auto waar iemand in zat. Er werd vijf keer geschoten, daarna trok de groep zich\
    \ terug.</p>\n        <p><em>Op deze beelden is vermoedelijk te zien hoe iemand van de\
    \ bende op degene in de auto schiet:</em></p>\n        <p>De politie zei vanmiddag tijdens\
    \ de persconferentie dat een 51-jarige man uit Wijchen is doodgeschoten. Dat is zo goed\
    \ als zeker de persoon die in de auto zat. Hij zou als beveiliger door de bewoners van\
    \ het huis zijn ingehuurd.</p>\n        <p>De gemaskerde mannen hebben ook op twee politieagenten\
    \ geschoten die op de melding van een verdachte situatie waren afgestuurd. Een van de\
    \ twee raakte daarbij levensbedreigend gewond. De agenten zijn inmiddels beiden buiten\
    \ levensgevaar.</p>\n        <p><em>Een inwoner van Overasselt zei tegen Nieuwsuur dat\
    \ hij de agenten op straat zag liggen: </em></p>\n        <p>Daarna maakten agenten en\
    \ de Dienst Speciale Interventies met helikopters en honden jacht op de bendeleden, in\
    \ tuinen, in maïsvelden, op snelwegen en bij een station. Daarbij zijn waarschuwingsschoten\
    \ gelost.</p>\n        <p>Plaatsvervangend politiechef Aalbers zei dat op verschillende\
    \ plaatsen in het land 34 verdachten zijn opgepakt. Onder hen zijn mensen uit Frankrijk,\
    \ België, Algerije en Nederland. Rechercheurs deden op meerdere plaatsen onderzoek.</p>\n\
    \        <h2>Drugsconflict</h2>\n        <p>Alles wijst erop dat Overasselt het strijdtoneel\
    \ was van een conflict tussen drugscriminelen. <a href=\"https://www.parool.nl/misdaad/schietpartij-in-overasselt-gelinkt-aan-hoogopgelopen-conflict-over-grote-hoeveelheid-cocaine-van-bolle-jos~baf5fcb9/\"\
    >Het Parool</a> en <a href=\"https://www.telegraaf.nl/binnenland/schietpartij-overasselt-ontstaan-door-geescaleerd-drugsconflict-mogelijk-gelieerd-aan-bolle-jos/160789927.html\"\
    >De Telegraaf</a> hoorden van bronnen dat de inzet van dat conflict een grote verdwenen\
    \ partij cocaïne is van de organisatie van de voortvluchtige crimineel Jos L., ook wel\
    \ 'Bolle Jos' genoemd.</p>\n        <p>Een van de bewoners, Jan G., zou in het verleden\
    \ zaken met hem hebben gedaan. Volgens Het Parool gaan personen in het criminele milieu\
    \ ervan uit dat de bende naar Overasselt kwam om een deel van de verdwenen partij terug\
    \ te halen.</p>\n        <p>Om die te kunnen tillen waren er zo veel mensen opgetrommeld.\
    \ De Telegraaf schrijft dat Jan G. met een kind via de achterkant van zijn woning wist\
    \ te ontkomen.</p>\n        <p>Veel inwoners van Overasselt zijn niet verbaasd over de\
    \ verhalen over een drugsconflict. Iedereen weet dat Jan G. bij drugshandel betrokken\
    \ was, zegt iemand die hem en zijn familie goed kent.</p>\n        <p>Dat iedereen op\
    \ de hoogte was is niet zo vreemd. De familie waar het om gaat, kwam vanwege drugshandel\
    \ meerdere keren in aanvaring met justitie. In 2019 werd bij een brand op het terrein\
    \ een drugslab ontdekt.</p>\n        <p>In 2024 stonden er op een dag gewapende mannen\
    \ voor de poort en vorig jaar vuurde iemand met een automatisch wapen 25 kogels op de\
    \ boerderij af. Volgens <a href=\"https://www.gelderlander.nl/heumen/doelwit-van-schietpartij-overasselt-eerder-dit-jaar-veroordeeld-tot-vier-jaar-cel-dit-is-waarom-hij-toch-nog-niet-achter-tralies-zit~a77a98bb/\"\
    >De Gelderlander</a> is Jan G. dit jaar tot een gevangenisstraf van vier jaar veroordeeld.\
    \ Hij gaat daartegen in beroep, zei zijn advocaat.</p>"
