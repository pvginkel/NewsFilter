  title: Sporttrainer die kinderkampen begeleidde verdacht van seksueel misbruik
  summary: '<p>Een 37-jarige man uit Bodegraven wordt verdacht van seksueel misbruik van minderjarigen
    en het delen van kinderporno. Dat gebeurde mogelijk jarenlang. Dat bleek tijdens een pro-formazitting
    bij de rechtbank in Den Haag. De man zit al sinds de zomer vast.</p>

    <p>Uit het onderzoek naar de man is volgens justitie naar boven gekomen dat hij zeker
    drie minderjarigen fysiek heeft misbruikt. Ook bleek daaruit dat de man kinderporno deelde
    via een versleutelde communicatiedienst. Daarbij gaat het niet om materiaal van de nu
    bekende slachtoffers, zegt het OM. De verdenkingen staan vooralsnog los van elkaar.</p>

    <p>De man benaderde slachtoffers mogelijk bij een klimvereniging in sportcentrum Pentagon
    in Dordrecht, waar hij van 2003 tot eind 2019 actief was als sporttrainer.</p>

    <p>Daarnaast was hij van 2003 tot eind 2018 verbonden aan de Zuidhovenkerk in Dordrecht,
    waar hij kinderkampen begeleidde. Daarna was hij tot juli 2024 lid van de Ichthuskerk
    in Bodegraven. Volgens het OM is het niet uitgesloten dat hij via die kerken in contact
    kwam met minderjarigen.</p>

    <h2>Versleutelde apps</h2>

    <p>Het Team Bestrijding Kinderporno en Kindersekstoerisme van de politie kwam de man op
    het spoor in de zomer van vorig jaar, bij een onderzoek naar kinderporno op versleutelde
    chatapps. De man viel op omdat hij beelden deelde van seksueel misbruik van soms zeer
    jonge kinderen in verschillende groepen, aldus het OM.</p>

    <p>In de chats sprak de verdachte veelvuldig over het jarenlange seksueel misbruik van
    minderjarigen dat hij zou hebben gepleegd, bij zowel jongens als meisjes. De man is aangehouden
    op 26 juli vorig jaar en zit sindsdien in voorlopige hechtenis.</p>

    <p>Hoeveel slachtoffers hij heeft gemaakt is onduidelijk. De politie is op zoek naar slachtoffers
    en getuigen.</p>'
