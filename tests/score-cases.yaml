  title: Meta stopt samenwerking met factcheckers in de VS vanwege 'censuur'
  summary: '<p>Het Amerikaanse techbedrijf Meta stopt de samenwerking met factcheckers in
    de Verenigde Staten. Dat heeft eigenaar Mark Zuckerberg vandaag aangekondigd. In plaats
    daarvan gaat Meta, het moederbedrijf van Facebook en Instagram, over op een systeem waarbij
    andere gebruikers commentaar kunnen leveren op mogelijk misleidende berichtgeving.</p>

    <p>Het systeem op basis van opmerkingen van gebruikers is vergelijkbaar met Community
    Notes van X. In dit systeem hebben gebruikers de mogelijkheid om commentaar te geven op
    potentieel misleidende posts. Het zijn dus niet meer professionele factcheckers die de
    inhoud toetsen.</p>

    <p>Het bedrijf zegt de samenwerking met experts, onder wie journalisten van grote internationale
    persbureaus, op omdat die volgens Zuckerberg "politiek bevooroordeeld" zijn. "De factcheckers
    hebben het vertrouwen meer kwaad dan goed gedaan", zegt Zuckerberg in een videoboodschap.</p>

    <h2>Immigratie en gender</h2>

    <p>Zuckerberg zegt ook het moderatiebeleid rondom bepaalde onderwerpen te willen veranderen.
    "We willen minder restricties rondom onderwerpen als immigratie en gender." Volgens hem
    zijn Facebook en Instagram veranderd van inclusieve platforms naar platforms waar mensen
    te snel de mond wordt gesnoerd.</p>

    <p>Ook worden er volgens hem te veel berichten op feiten gecheckt en gecensureerd. Partijen
    die de factchecks doen zijn bijvoorbeeld medewerkers van grote internationale persbureaus
    als AFP, AP en Reuters.</p>

    <p>Zuckerberg zei dat de afgelopen verkiezingen in de VS een grote rol hebben gespeeld
    bij zijn besluit. "De laatste verkiezingen voelen als een cultureel omslagpunt om vrijheid
    van meningsuiting opnieuw op de voorgrond te zetten."</p>

    <p>De wijzigingen zullen gevolgen hebben voor Instagram, Facebook en Threads. De socialemediaplatforms
    hebben wereldwijd miljarden gebruikers. Zuckerberg zegt de aanpassingen de komende maanden
    te willen doorvoeren.</p>

    <p>Wat dit nieuws betekent voor de platforms van Meta in Europa, is nog niet duidelijk.</p>'
