  title: Ongelukken in Groningen en Friesland door gladheid en ijzel
  summary: <p>Op de N31 tussen Garyp en Drachten zijn meerdere automobilisten in de problemen
    gekomen. Een auto belandde op zijn kop en een andere auto kwam in een sloot terecht. Volgens
    Omrop Fryslân gleden verschillende auto's tegen de vangrail op de N31.</p><p>De weg is
    afgesloten en automobilisten kunnen omrijden via de A7 of A32.</p><p>Ook op andere plekken
    in Nederland is het vanochtend glad. Voor alle provincies geldt code geel tot 11.00 uur.
    In het zuiden en oosten is er daarnaast kans op dichte mist. Alleen in het Waddengebied
    wordt geen gladheid door ijzel verwacht.</p>
