  title: Meer bevoegdheden veiligheidsdiensten vanwege Rusland, China en Iran
  summary: "<p>De inlichtingendiensten AIVD en MIVD krijgen meer mogelijkheden om \"evidente\
    \ tegenstanders\" op te sporen en aan te pakken. Dat staat in een wetsvoorstel van het\
    \ kabinet.</p>\n        <p>Evidente tegenstanders zijn bijvoorbeeld Russische hackers,\
    \ Chinese spionnen, aanslagplegers van Iran en terroristen van IS.</p>\n        <p>Burgers\
    \ en andere belanghebbenden kunnen vanaf nu via <a href=\"https://www.internetconsultatie.nl/\"\
    >internetconsultatie.nl</a> reageren op de wetteksten. Naar verwachting zullen veel vragen\
    \ gaan over de privacy van Nederlanders. Defensieminister Yesilgöz, verantwoordelijk voor\
    \ de militaire veiligheidsdienst MIVD, zegt dat die gewaarborgd blijft.</p>\n        <p>\"\
    De diensten krijgen meer bevoegdheden om sneller en gerichter te reageren op evidente\
    \ tegenstanders. Maar de toezichthouder blijft controleren\", zegt Yesilgöz in een toelichting\
    \ op de wet. \"Poetin en zijn vriendjes verdienen niet onze privacy, maar de burgers in\
    \ Nederland wel.\"</p>\n        <p>De diensten hoeven bijvoorbeeld niet meer vooraf toestemming\
    \ te vragen voor het (digitaal) volgen van een individuele hacker. \"Dan is die alweer\
    \ gevlogen\", zegt Yesilgöz.</p>\n        <p>Als de Russische geheime dienst als evidente\
    \ tegenstander is benoemd, dan kunnen MIVD en AIVD alle hackers aanpakken die waarschijnlijk\
    \ voor deze dienst opereren. Achteraf controleert de toezichthouder of dit rechtmatig\
    \ was. Ook kan de toezichthouder lopende operaties stilleggen in het geval van onrechtmatigheden.</p>\n\
    \        <h2>Informatie vorderen</h2>\n        <p>In de wet worden ook mogelijkheden toegevoegd\
    \ voor de veiligheidsdiensten om samen te werken met Nederlandse bedrijven en organisaties.\
    \ En om organisaties te wijzen op risico's die zij lopen door vijanden. Minister Heerma\
    \ van Binnenlandse Zaken, verantwoordelijk voor de AIVD, wil geen voorbeelden noemen.</p>\n\
    \        <p>\"Ik ga niet in detail vertellen om welke organisaties het gaat\", zegt Heerma.\
    \ \"Nu wordt er ook al samengewerkt. Deze wet regelt de wettelijke basis daaronder. Daarbij\
    \ kan het ook om het vorderen van informatie gaan.\" Het gaat bijvoorbeeld om banken,\
    \ universiteiten en online platforms, zo staat in het persbericht over de wet.</p>\n \
    \       <p>Het vorige kabinet wilde bijvoorbeeld 8000 buitenlandse wetenschappers en studenten\
    \ op Nederlandse universiteiten screenen om te voorkomen dat Nederlandse informatie in\
    \ handen komt van buitenlandse krachten. China, Rusland en Iran zouden kennis kunnen misbruiken\
    \ in bijvoorbeeld wapensystemen. Die grote screeningsoperatie <a href=\"https://nos.nl/artikel/2618141-buitenlandse-wetenschappers-toch-niet-massaal-gescreend-op-spionagerisico\"\
    >was onhaalbaar</a>. Gerichte samenwerking is dat wel, zegt het huidige kabinet.</p>\n\
    \        <h2>Gevangenissen en IND</h2>\n        <p>Ook kunnen door nieuwe regels de krijgsmacht\
    \ en de eigen militaire inlichtingen- en veiligheidsdienst makkelijker onderling informatie\
    \ uitwisselen. Ook de samenwerking met medeoverheden zoals de Dienst Justitiële Inrichtingen\
    \ (het gevangeniswezen) en de Immigratie- en Naturalisatiedienst (IND) is geregeld.</p>\n\
    \        <p>Het toezicht op de juiste uitvoering van in de wet komt bij één toezichthouder\
    \ te liggen, het College van toetsing en toezicht. Nu zijn dat nog de CTIVD en de Toetsingscommissie\
    \ Inzet Bevoegdheden. Of door de samenvoeging het budget omlaag gaat wil Heerma niet zeggen.\
    \ \"Dat is niet het doel van deze wet.\"</p>\n        <p>Beide toezichthouders hadden\
    \ de afgelopen jaren kritiek op de werkwijze van de AIVD en de MIVD. Daarbij ging het\
    \ om het <a href=\"https://nos.nl/artikel/2560145-aivd-en-mivd-vergaren-steeds-vaker-informatie-in-het-geheim\"\
    >verzamelen</a> van informatie over individuen en om het <a href=\"https://nos.nl/artikel/2621135-inlichtingendiensten-houden-zich-niet-aan-regels-voor-datasets-met-persoonsgegevens\"\
    >bewaren</a> van grote hoeveelheden persoonsgegevens.</p>"
