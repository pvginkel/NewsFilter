  title: Eigen risico zorgverzekering gaat per 2027 omhoog naar 500 euro
  summary: <p>De Tweede Kamer heeft ingestemd met een verhoging van het eigen risico in de
    zorgverzekering. Vanaf 1 januari 2027 betalen verzekerden de eerste 500 euro aan zorgkosten
    zelf, nu is dat 385 euro.</p><p>De maatregel geldt voor iedereen van 18 jaar en ouder.
    Het kabinet verwacht dat de zorgpremie hierdoor iets minder hard stijgt. Zorgverzekeraars
    maken in november bekend wat de premies voor volgend jaar worden.</p>
