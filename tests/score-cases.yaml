  title: Dode in Utrecht door het westnijlvirus, opgelopen in Nederland
  summary: "<p>In de provincie Utrecht is iemand overleden aan de gevolgen van het westnijlvirus.\
    \ Diegene had het virus in Nederland opgelopen en is gestorven in het ziekenhuis. Dat\
    \ meldt het RIVM.</p>\n        <p>Vorige week werd het virus voor het eerst <a href=\"\
    https://nos.nl/artikel/2627232-westnijlvirus-aangetroffen-bij-bloeddonor-in-nederland-eerste-keer-sinds-2020\"\
    >sinds 2020 aangetroffen</a> in Nederland. Dat gebeurde bij een bloeddonor in de provincie\
    \ Utrecht die niet recent in het buitenland was geweest.</p>\n        <p>Het gaat niet\
    \ om dezelfde persoon, laat de woordvoerder weten. </p>\n        <h2>Twee patiënten</h2>\n\
    \        <p>Het RIVM heeft het westnijlvirus dit jaar gevonden in de provincies Utrecht,\
    \ Noord-Brabant en Zuid-Holland. Het kan zijn dat het virus op meer plekken in Nederland\
    \ voorkomt, zegt het RIVM.</p>\n        <p>Er ligt nog zeker een patiënt in het ziekenhuis.\
    \ Andere meldingen worden nog onderzocht. Over hun medische toestand doet het gezondheidsinstituut\
    \ geen verdere mededelingen.</p>\n        <h2>Meestal geen klachten</h2>\n        <p>Het\
    \ westnijlvirus komt vooral voor bij vogels. Het kan bij de gewone huissteekmug belanden\
    \ wanneer die zich voedt met het bloed van een besmette vogel. Een mug kan het vervolgens\
    \ weer overdragen op mensen en andere dieren.</p>\n        <p>Het overgrote deel van de\
    \ mensen (80 procent) krijgt geen klachten. Ongeveer 19 procent krijgt griepklachten en\
    \ 1 procent krijgt neurologische klachten. Vooral kwetsbare mensen lopen risico.</p>\n\
    \        <p>Mensen kunnen het virus niet verder verspreiden. Het RIVM zegt dat het risico\
    \ om het westnijlvirus in Nederland op te lopen klein blijft, net als het risico om er\
    \ ziek van te worden.</p>"
- name: meer-nepmails-over-ideal
  min: 7
  max: 10
  why: 'A phishing wave: the plainest ''watch out for this'' there is.'
  title: 'Meer nepmails over iDeal en Wero in omloop: ''Klik er niet op'''
  summary: "<p>In de afgelopen maanden worden er meer nepmails gestuurd over de betalingsservice\
    \ iDeal en de overgang naar Wero. Dat blijkt uit cijfers van de Fraudehelpdesk, zegt die\
    \ organisatie na <a href=\"https://www.telegraaf.nl/financieel/geld/door-deze-nepmails-raak-je-veel-geld-kwijt-oplichters-slaan-slag-bij-overgang-van-ideal-naar-wero/160430241.html\"\
    >berichtgeving</a> in De Telegraaf. Ook Currence, het bedrijf achter iDeal en Wero, bevestigt\
    \ de cijfers.</p>\n        <p>Er zijn verschillende frauduleuze mails in omloop. Daarin\
    \ wordt <a href=\"https://nos.nl/artikel/2595710-betaaldienst-ideal-wordt-wero-trap-niet-in-oplichting-er-verandert-niets\"\
    >ten onrechte</a> gezegd dat consumenten actie moeten ondernemen om de overgang van iDeal\
    \ naar Wero mogelijk te maken. Ze moeten dan bijvoorbeeld op een link klikken en betalingsgegevens\
    \ achterlaten.</p>\n        <h2>Actie</h2>\n        <p>Begin dit jaar kreeg de Fraudehelpdesk\
    \ nog slechts enkele nepmails (phishing) per dag doorgestuurd van consumenten. In juli\
    \ liep dat op naar ongeveer honderd per dag.</p>\n        <p>Zo gaat er een phishingmail\
    \ rond waarin oplichters beweren dat iDeal per direct vervangen wordt door Wero. Consumenten\
    \ worden opgeroepen actie te ondernemen omdat ze nog geld zouden terugkrijgen. Om die\
    \ terugbetaling te ontvangen, zouden ze via een link hun gegevens moeten verifiëren.</p>\n\
    \        <p>In de nog lopende maand augustus lijkt het aantal meldingen weer iets terug\
    \ te lopen, zegt Currence.</p>\n        <h2>Wero</h2>\n        <p>Via iDeal kunnen in\
    \ Nederland online betalingen gedaan worden. Het wordt vervangen door het Europese systeem\
    \ Wero. De komende maanden zijn in Nederland bij online betalingen beide logo's te zien.</p>\n\
    \        <p>Uiteindelijk zal het iDeal-logo verdwijnen, maar dat zal geleidelijk gaan.\
    \ Het bedrijf verwacht dat later dit jaar de eerste grotere webwinkels dit aanpassen.\
    \ Eind 2027 zijn dan alle webwinkels overgestapt, is het streven.</p>\n        <p>Daniël\
    \ van Delft, directeur van Currence, herkent het beeld dat criminelen proberen gegevens\
    \ en geld proberen af te troggelen via nepmails. \"Al sinds wij bekendmaakten dat deze\
    \ rebranding zou plaatsvinden, zien we dat dit geprobeerd wordt.\"</p>\n        <p>Eerder\
    \ <a href=\"https://nos.nl/artikel/2595710-betaaldienst-ideal-wordt-wero-trap-niet-in-oplichting-er-verandert-niets\"\
    >waarschuwde</a> Van Delft al voor deze praktijken. Hij benadrukt dat de klant niets hoeft\
    \ te doen voor de overgang. \"Klik niet op mails die je oproepen om op links te klikken.\
    \ Check bij je bank wat het mailtje betekent.\"</p>"
- name: meta-schikt-voor-miljarden
  min: 1
  max: 5
  why: Billions, children, addiction -- and a foreign corporate settlement that changes nothing
    here. A big number is not relevance; production scored this an 8. Bounded at 5 rather than
    4 because 5 is what the prompt's own cap on nieuws over losse bedrijven allows, and a case
    should test the rule rather than the number that happened to come back once.
  title: Meta schikt voor miljarden in zaak over verslaafd maken van kinderen
  summary: "<p>Meta heeft een schikking getroffen in de grote rechtszaak in de VS over het\
    \ verslaafd maken van jongeren aan sociale media. Het moederbedrijf van Facebook en Instagram\
    \ heeft ingestemd om zo'n 17 miljard dollar te betalen, omgerekend zo'n 14,5 miljard euro.\
    \ Ook belooft Meta de apps aan te passen.</p>\n        <p>Afgelopen week begon de <a href=\"\
    https://nos.nl/artikel/2627352-megarechtszaak-tegen-meta-in-de-vs-begint-maakt-het-bedrijf-jongeren-bewust-verslaafd\"\
    >rechtszaak</a> in Californië. Bijna dertig Amerikaanse staten spanden die aan omdat het\
    \ techbedrijf jongeren bewust verslaafd zou maken aan sociale media. Ook zou Meta tactieken\
    \ gebruiken om gebruikers zo veel mogelijk tijd door te laten brengen op de platforms.</p>\n\
    \        <p>Ook werd Meta ervan beschuldigd dat het wetten heeft overtreden door regelmatig\
    \ gegevens te verzamelen van kinderen onder de 13 jaar zonder toestemming van hun ouders.</p>\n\
    \        <h2>Verslavende technieken</h2>\n        <p>Meerdere staten wilden Meta dwingen\
    \ de verslavende technieken achter de platforms aan te passen. Zo willen ze dat het bedrijf\
    \ stopt met verdwijnende berichten op accounts van kinderen, de zogenoemde 'stories' op\
    \ Facebook en Instagram.</p>\n        <p>Ook moeten \"dopamine-manipulerende aanbevelingsalgoritmes\"\
    \ verdwijnen, zoals het automatisch afspelen van video's. Daarmee moet 'eindeloos scrollen'\
    \ worden voorkomen. Het leuk vinden van berichten (liken) moet ook niet meer mogelijk\
    \ zijn, vinden de staten.</p>\n        <h2>Aanpassingen</h2>\n        <p>Met de schikking\
    \ komt een einde aan de rechtszaak. Naast het betalen van de schikking belooft Meta een\
    \ reeks veiligheidsmaatregelen in te voeren op de platforms.</p>\n        <p>Zo komt er\
    \ een strikte limiet voor de dagelijkse gebruiksduur en pauzes voor kinderen op Instagram\
    \ en Facebook. Verder zal het bedrijf pushmeldingen tijdens schooluren uitschakelen en\
    \ leeftijdscontroles uitvoeren om pesten en ander schadelijk materiaal te voorkomen. En\
    \ als laatste komen er strengere ouderlijke controles en wordt het aantal likes verborgen\
    \ bij minderjarige gebruikers.</p>"
- name: nog-400-schepen-vast
  min: 1
  max: 5
  why: Dramatic, geopolitically serious, and still war reporting with no concrete consequence
    stated. Production scored it 8.
  title: Nog 400 schepen vast in Perzische Golf, Iran claimt controle over Straat van Hormuz
  summary: "<p>Sinds het begin van de Iranoorlog een half jaar geleden liggen nog altijd 400\
    \ schepen vast in de Perzische Golf. Dat <a href=\"https://www.imo.org/en/mediacentre/pressbriefings/pages/statement-on-the-ongoing-crisis-in-the-strait-of-hormuz.aspx\"\
    >meldt</a> de Internationale Maritieme Organisatie (IMO). Ook zitten nog 6000 opvarenden\
    \ vast, zegt de organisatie.</p>\n        <p>\"Zes maanden na het begin van het conflict\
    \ in het Midden-Oosten is de situatie in de Straat van Hormuz nog steeds onopgelost\"\
    , aldus IMO's secretaris-generaal Arsenio Dominguez.</p>\n        <p>De wereldwijde economische\
    \ impact door verstoringen van handelsstromen voor olie, kunstmest en andere grondstoffen\
    \ door de blokkade is groot, zegt Dominguez. Sinds het begin van het conflict noteerde\
    \ de IMO minstens zeventig aanvallen op de internationale scheepvaart met negentien doden\
    \ tot gevolg.</p>\n        <p>De IMO-raad nam vorige maand een resolutie aan waarin wordt\
    \ opgeroepen tot een \"gecoördineerde en duurzame terugkeer naar onbelemmerde navigatie\
    \ door de Straat van Hormuz\".</p>\n        <h2>Iran claimt controle</h2>\n        <p>Vannacht\
    \ claimde de Iraanse Revolutionaire Garde op Telegram dat Iran de volledige controle heeft\
    \ over de Straat van Hormuz, waar voor het uitbreken van de oorlog 20 procent van de wereldwijde\
    \ oliehandel doorheen ging. De VS beweert dat de smalle zee-engte gewoon open is en onder\
    \ Amerikaanse controle staat.</p>\n        <p>Commandant Brown van het Amerikaanse militaire\
    \ commando voor het Midden-Oosten zei donderdag dat de gehele Straat van Hormuz mijnvrij\
    \ was gemaakt en de internationale scheepvaart vrij kon doorvaren.</p>\n        <p>Iran\
    \ zegt dat schepen die zonder toestemming door de Straat van Hormuz varen worden tegengehouden.\
    \ De claim van de VS dat de Straat van Hormuz open is, wordt als \"flagrante leugen\"\
    \ afgedaan.</p>\n        <p>Volgens de Britse maritieme organisatie UKMTO passeerden er\
    \ de afgelopen week gemiddeld 29 vrachtschepen per dag door de straat. Voor het begin\
    \ van de oorlog waren dat <a href=\"https://nos.nl/artikel/2606837-straat-van-hormuz-niet-potdicht-dagelijks-zo-n-2-miljoen-olievaten-vervoerd\"\
    >tot wel 130 schepen</a>.</p>\n        <p>De VS probeert Iran de afgelopen periode onder\
    \ druk te zetten met <a href=\"https://nos.nl/artikel/2628157-vs-komt-met-economische-d-day-tegen-iran-maar-teheran-heeft-tegenwapen-hormuz\"\
    >een economische oorlog</a>. Washington wil Iran volledig isoleren van de wereldeconomie\
    \ en dreigt ook andere landen en bedrijven te straffen die zaken blijven doen met Teheran.</p>\n\
    \        <p>Iran kondigde vergelding aan en wil al langer dat de VS de verplichtingen\
    \ uit de (<a href=\"https://nos.nl/artikel/2626093-nieuwe-eisen-iran-voor-heropening-straat-van-hormuz-snelle-deal-lijkt-uit-zicht\"\
    >inmiddels verlopen</a>) intentieverklaring voor vrede <a href=\"https://nos.nl/artikel/2618288-akkoord-tussen-iran-en-vs-over-tekst-voor-intentieverklaring-lijkt-dichtbij\"\
    >uit juni</a> nakomt. Drie weken geleden stelde Iran de VS <a href=\"https://nos.nl/artikel/2626093-nieuwe-eisen-iran-voor-heropening-straat-van-hormuz-snelle-deal-lijkt-uit-zicht\"\
    >nieuwe eisen</a> voor heropening van de Straat van Hormuz. </p>"
- name: zeelandbrug-komende-weken-dicht
  min: 1
  max: 4
  why: Immediate and concrete, but local infrastructure. Immediate is not the same as important;
    production scored it 7.
  title: Zeelandbrug komende weken dicht voor onderhoud
  summary: "<p>De Zeelandbrug is vanaf morgen tot en met 12 oktober dicht voor voertuigen\
    \ wegens onderhoud. Het beweegbare deel van de brug moet worden gerenoveerd, meldt de\
    \ provincie Zeeland.</p>\n        <p>Er zijn scheuren ontstaan in het stalen rijdek van\
    \ de basculebrug, het beweegbare deel van de Zeelandbrug. Die zijn onder meer veroorzaakt\
    \ door veroudering en door zwaar verkeer dat er dagelijks op rijdt, meldt de provincie.</p>\n\
    \        <p>De brug is in 1965 aangelegd, in 2016 werd het een rijksmonument. Er rijden\
    \ dagelijks ongeveer 15.000 voertuigen over de verbinding tussen Noord-Beveland en Zierikzee\
    \ op Schouwen-Duiveland.</p>\n        <p>Het verkeer wordt de komende zes weken via de\
    \ Oosterscheldekering omgeleid. Het landbouwverkeer mag op vaste momenten 's nachts over\
    \ de Oosterscheldekering en via de A4 en A58 rijden. Fietsers en bromfietsers kunnen gebruiken\
    \ blijven maken van de brug.</p>\n        <p>De provincie vraagt mensen om thuis te werken\
    \ of om buiten de spits om te reizen. Mensen die reizen met het openbaar vervoer moeten\
    \ rekening houden met een langere reistijd.</p>"
- name: onderhandelingen-prinsjesdag-moeizaam-kabinet
  min: 1
  max: 5
  why: Process coverage of a dossier that genuinely matters. The akkoord is a 7; the negotiating
    about it is not, or one event becomes ten messages.
  title: Onderhandelingen Prinsjesdag moeizaam, kabinet intern verdeeld
  summary: "<p>De drie coalitiepartijen D66, VVD en CDA zijn het onderling nog niet eens over\
    \ de begrotingen voor Prinsjesdag. Dat zeggen verschillende bronnen vanuit de oppositiepartijen.\
    \ Ook vicepremier Van den Brink (CDA) zei vanmiddag dat de puzzel de komende dagen vooral\
    \ \"intern\" moeten worden gelegd.</p>\n        <p>De regeringspartijen discussiëren over\
    \ bij welke burgers de rekening terecht moet komen, met andere woorden: hoe de belastingdruk\
    \ voor de Rijksuitgaven verdeeld moet worden.</p>\n        <p>Ondertussen onderhandelt\
    \ het kabinet wel met de oppositiepartijen voor steun. En dat is lastig als het minderheidskabinet\
    \ het onderling nog niet eens is, zeggen zij. Aanstaande vrijdag wil het minderheidskabinet\
    \ 'een klap geven' op de stukken die op Prinsjesdag worden gepresenteerd. Het wil dan\
    \ eigenlijk ook al weten of er voldoende steun is in de Tweede Kamer.</p>\n        <h2>Nog\
    \ niks concreets</h2>\n        <p>Volgens fractievoorzitter Markuszower van de Groep Markuszower,\
    \ die vandaag aanschoof bij de premier en de vicepremiers, ligt er een paar dagen van\
    \ tevoren \"nog niks concreets op tafel\".</p>\n        <p>Ook BBB-leider Vermeer, die\
    \ gisteren met minister Heinen van Financiën sprak en vanmiddag een gesprek had met de\
    \ top van het kabinet, betwijfelt of het lukt om vrijdag al verzekerd te zijn van een\
    \ meerderheid. Het kabinet is volgens hem \"rijkelijk laat\" met de oppositie in gesprek\
    \ gegaan.</p>\n        <p>Gisteren hadden andere oppositiepartijen er na hun afspraak\
    \ met de coalitie ook al <a href=\"https://nos.nl/artikel/2628171-muurvast-rommeltje-en-kleurloos-steun-voor-begroting-kabinet-nog-steeds-ver-weg\"\
    >geen goed</a> woord voor over. \"Het zit muurvast\", zegt Pro-leider Klaver. \"We zijn\
    \ er nog lang niet\", zegt SGP-Kamerlid Flach.</p>\n        <h2>'Vrijheidsbijdrage'</h2>\n\
    \        <p>De moeilijkheid ligt bij een aantal grote dossiers, waarbij het om miljarden\
    \ gaat. Van de 'vrijheidsbijdrage' voor burgers uit het coalitieakkoord is duidelijk dat\
    \ die niet ongeschonden de eindstreep haalt. Maar waar de rekening voor de extra defensie-uitgaven\
    \ dan moet komen te liggen is niet duidelijk.</p>\n        <p>Deze verhoging van de inkomstenbelasting,\
    \ bedacht door het CDA, zou de koopkracht te veel aantasten en ligt veel partijen van\
    \ links tot rechts zwaar op de maag.</p>\n        <p>Een soortgelijk verhaal geldt voor\
    \ de andere dossiers waarover nu met de oppositie wordt gesproken. Zoals box 3, de belasting\
    \ op vermogen die het <a href=\"https://nos.nl/artikel/2621107-eerste-kamer-stelt-stemming-over-box-3-voorlopig-uit-nieuw-voorstel-beloofd\"\
    >kabinet wil gaan aanpassen</a>. Door deze aanpassing loopt de staatskas (tijdelijk) geld\
    \ mis.</p>\n        <p>Pro zou daar naar verwachting mee kunnen leven, op voorwaarde dat\
    \ de rekening van het misgelopen geld bij vermogenden terechtkomt en niet op het bordje\
    \ van mensen die minder verdienen. Het is niet duidelijk of het kabinet daaraan tegemoetkomt.</p>\n\
    \        <h2>Puzzel 'intern' leggen</h2>\n        <p>Een meerderheid in de Tweede Kamer,\
    \ van coalitie tot oppositie, is het er ook over eens dat gekeken moet worden naar het\
    \ kabinetsplan om het <a href=\"https://nos.nl/artikel/2601116-nieuw-kabinet-wil-uitkeringen-voor-hoge-inkomens-fors-verlagen\"\
    >maximumdagloon te verlagen</a>. Daardoor zouden uitkeringen van mensen die relatief meer\
    \ verdiend hebben, te veel omlaag gaan.</p>\n        <p>Verder gaat de verhoging van het\
    \ eigen risico in de zorg volgend jaar (van 385 naar 455 euro per jaar) waarschijnlijk\
    \ niet door. Maar de vraag is ook hier weer: hoe moet dat gat in de begroting worden betaald\
    \ en is daar voldoende steun voor vanuit de oppositie?</p>\n        <p>Als dat niet voor\
    \ vrijdag lukt dan kan er het weekend nog doorgepraat worden. Maar de Prinsjesdagstukken\
    \ moeten echt vóór 1 september bij de Raad van State binnen zijn voor advies. Officieel\
    \ heeft het kabinet dus tot en met maandag 31 augustus de tijd.</p>\n        <p>Het lijkt\
    \ op dit moment uitgesloten dat er maandag al een compleet akkoord met de oppositie ligt\
    \ met een meerderheid in de Tweede en Eerste Kamer. Bronnen denken dat die onderhandelingen\
    \ nog wel tot de derde dinsdag van september zullen doorgaan.</p>"
- name: verdeelde-reacties-op-rapport
  min: 1
  max: 5
  why: 'Reactions to a report. The same rule from the other side: it is the development that
    scores, not the response to it.'
  title: Verdeelde reacties op rapport over stikstofplannen, nieuwe rechtszaken verwacht
  summary: "<p>Boeren, bouwers en natuurbeschermers reageren wisselend op de analyse die het\
    \ Planbureau voor de Leefomgeving (PBL) maakte over de <a href=\"https://nos.nl/artikel/2620433-kabinet-wil-nederland-gebied-voor-gebied-van-het-stikstofslot-halen\"\
    >stikstofplannen</a> van het kabinet. Het PBL <a href=\"https://nos.nl/artikel/2629576-stikstofplannen-halen-land-niet-van-het-slot-wel-grote-stap-vooruit\"\
    >concludeert</a> dat Nederland niet van het stikstofslot gaat, maar het kabinet wel belangrijke\
    \ stappen zet. Voor een deel van de boeren zijn de plannen niet haalbaar.</p>\n      \
    \  <p>Bouwend Nederland is blij met de beoordeling van het PBL. \"Het stikstofpakket haalt\
    \ Nederland uit de impasse en brengt perspectief\", zegt voorman Arno Visser. Het is nu\
    \ tijd voor \"uitwerking en uitvoering\".</p>\n        <p>Het Economisch Instituut voor\
    \ de Bouw benadrukt dat de problemen rond vergunningverlening nog niet zijn opgelost.\
    \ De situatie voor de bouw wordt pas echt beter als er voor kleine beetjes stikstof geen\
    \ vergunning meer nodig is.</p>\n        <p>Afzwakking van het maatregelenpakket is geen\
    \ optie, vinden natuurorganisaties. Zo ziet Natuurmonumenten de maatregelen als de \"\
    minimale ondergrens van wat nodig is voor natuurherstel\". Daar sluit Natuur &amp; Milieu\
    \ zich bij aan. \"Dit pakket is nodig om de balans tussen landbouw en natuur weer te herstellen.\"\
    </p>\n        <h2>Natuur wordt verbeterd</h2>\n        <p>De natuur gaat er inderdaad\
    \ op vooruit, blijkt uit de analyse van het PBL. Hoewel in 2035 het stikstofprobleem in\
    \ slechts 14 van de 120 gebieden helemaal is opgelost, neemt de mate van overbelasting\
    \ in de andere gebieden wel fors af, is te lezen in het rapport.</p>\n        <p>Daarvoor\
    \ moet wel de stikstofuitstoot in 2035 flink lager liggen dan in 2019. Voor de landbouwsector\
    \ is het doel 42 tot 46 procent minder stikstofuitstoot. Verkeer en industrie moeten de\
    \ uitstoot straks met de helft verminderen.</p>\n        <p>Maar Nederland gaat niet direct\
    \ \"van het stikstofslot\", wat het kabinet wel graag wilde. \"Maar wij kunnen ons ook\
    \ geen pakket voorstellen dat dit wél kan\", zegt het PBL daarover. Het maatregelenpakket\
    \ van minister Van Essen vraagt om een inspanning die grenst aan wat in tien jaar uitvoerbaar\
    \ is, aldus het planbureau.</p>\n        <p>Toch vindt Johan Vollenbroek van Mobilisation\
    \ for the Environment (MOB) dat het \"veel te weinig\" is wat de minister van plan is.\
    \ Hij is kritisch over het feit dat het stikstofdoel van het kabinet pas in 2035 wordt\
    \ bereikt, in plaats van in 2030. Volgens de MOB-voorman is een halvering van de veestapel\
    \ nodig om Nederland van het slot te krijgen.</p>\n        <p>\"Als we dit wankele beleid\
    \ zien, dan zullen wij toch weer de rechter gaan vragen om natuurvergunningen in te trekken\"\
    , kondigt Vollenbroek aan, die momenteel al tientallen soortgelijke procedures voert.</p>\n\
    \        <h2>Grote offers van boeren</h2>\n        <p>Waar MOB de plannen te zwak vindt,\
    \ vinden veel boeren ze juist te zwaar. Over de eisen die aan veehouderijen gesteld worden\
    \ leven grote zorgen bij boerenbelangenorganisatie Agractie, die vindt \"dat Nederland\
    \ de weg volledig kwijt is\". Voldoen aan de nieuwe eisen is te duur voor veel veehouders,\
    \ waarschuwt de organisatie al langer.</p>\n        <p>Uit de analyse van het planbureau\
    \ blijkt dat die zorgen terecht zijn. Aan de regels voldoen, is niet voor alle boeren\
    \ financieel haalbaar, aldus het PBL. De verwachting is dan ook dat boeren die de benodigde\
    \ aanpassingen niet kunnen betalen, met hun bedrijf zullen stoppen.</p>\n        <p>Boerenorganisatie\
    \ LTO eist dat de stikstofplannen worden verbeterd. \"Boeren moeten meer mogelijkheden\
    \ krijgen waaruit zij kunnen kiezen om de stikstofdoelen te halen\", is te lezen in een\
    \ reactie. Daarmee kan de boer \"vanuit vakmanschap en ondernemerschap\" kiezen welke\
    \ aanpassingen passen bij het eigen bedrijf.</p>\n        <h2>Stok achter de deur</h2>\n\
    \        <p>Een van de maatregelen uit het stikstofpakket moet sowieso van tafel, vindt\
    \ de boerenorganisatie: de zogeheten 'generieke korting' voor boeren. Die stok achter\
    \ de deur houdt in dat boeren dieren moeten wegdoen als de doelen toch niet gehaald worden.</p>\n\
    \        <p>Het PBL heeft daar ook kritiek op. Het planbureau is bang dat de dreigende\
    \ korting boeren weerhoudt van verduurzaming, want waarom zou je dure aanpassingen aan\
    \ je bedrijf doen als je later misschien alsnog dieren kwijtraakt?</p>\n        <p>\"\
    Het spreken over generieke krimp is onnodig, werkt averechts en is voor LTO onbespreekbaar\"\
    , zegt de organisatie, die wekelijks met minister Van Essen praat over verbetering van\
    \ zijn plannen.</p>\n        <p>Van Essen heeft vertrouwen dat de stikstofdoelen gehaald\
    \ worden en de generieke korting niet nodig is. Toch houdt hij eraan vast. \"Ze staan\
    \ in de plannen en het coalitieakkoord als een noodrem.\" Hij hoopt daarmee voldoende\
    \ zekerheid te geven dat het de goede kant op gaat met de natuur, zodat vergunningverlening\
    \ weer mogelijk wordt. \"Maar het kabinet wil de generieke korting niet inzetten\", benadrukt\
    \ de minister.</p>"
