  title: Kabinet komt met afstandsnorm voor windmolens
  summary: "<p>Het kabinet komt met nieuwe regels voor windmolens. Het gaat om de zogenoemde\
    \ afstandsnorm: hoe ver moet een windmolen van huizen verwijderd zijn. Die norm wordt\
    \ twee keer de tiphoogte, het hoogste punt dat een wiek kan bereiken.</p>\n        <p>Een\
    \ windmolen van 200 meter hoog moet dus minimaal 400 meter van het dichtstbijzijnde huis\
    \ verwijderd zijn.</p>\n        <p>In mei meldde de Rijksdienst voor Ondernemend Nederland\
    \ (RVO) dat de bouw van windmolens in Nederland bijna stilvalt. De voornaamste oorzaak\
    \ is volgens de RVO onduidelijkheid over de regels waar windparken op land aan moeten\
    \ voldoen. In 2021 sneuvelden de oude regels bij de rechter.</p>\n        <p>Hoewel er\
    \ op dit moment dus geen landelijke normen zijn, mogen provincies en gemeenten wel vergunningen\
    \ verlenen. In de praktijk zijn ze hier terughoudend mee.</p>\n        <h2>Geluid en slagschaduw</h2>\n\
    \        <p>Het kabinet zegt dat windmolens hard nodig zijn, en komt daarom met regels\
    \ die de bouw en vergunningverlening weer op gang moeten brengen.</p>\n        <p>Staatssecretaris\
    \ Bertram van Milieu: \"Ook komen er regels voor onder andere geluid, slagschaduw en lichtschittering.\
    \ Met deze nieuwe regels brengen we de belangen van omwonenden, de woningbouwopgave en\
    \ de energietransitie beter met elkaar in balans.\"</p>\n        <p>De nieuwe regels worden\
    \ voor het einde van het jaar naar de Kamer gestuurd.</p>"
