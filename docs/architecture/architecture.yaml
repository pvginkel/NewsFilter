schemaVersion: "0.1"
producer: newsfilter

applicationComponents:
  - id: app:newsfilter,22a90359-073c-4b89-a80f-87b4f1adb4b5
    label: NewsFilter
    summary: >-
      One-shot batch job that pulls the NOS Algemeen Nieuws RSS feed, scores
      each new article 1-10 against the prompt criteria via OpenAI, and posts
      qualifying articles to Telegram.
    introduced: 2025-01-06
    lifecycle: active
    stereotype: SoftwareProduct
    sourceRepository: git:pvginkel/NewsFilter
    stats:
      image: registry:5000/newsfilter

applicationServices:
  # OpenAI and Telegram are shared external services, declared once in the
  # `architecture` base set (svc:openai-api,b4e2a983-…; svc:telegram-bot-api,
  # 6708ef33-…) and referenced by UUID in the relations below.
  - id: svc:nos-rss-feed,83b382b5-0fcc-4aa6-8dbd-3533c485f605
    label: NOS Algemeen Nieuws RSS feed
    summary: >-
      Public NOS Algemeen Nieuws RSS feed, parsed each run as the source of
      candidate articles.
    introduced: 2025-01-06
    lifecycle: active
    stats:
      homepage: https://nos.nl/

relations:
  - id: rel:openai-serves-newsfilter
    source: svc:openai-api,b4e2a983-5c32-4ed1-94a1-6231a2112ccb
    target: app:newsfilter,22a90359-073c-4b89-a80f-87b4f1adb4b5
    type: Serving

  - id: rel:telegram-serves-newsfilter
    source: svc:telegram-bot-api,6708ef33-aaf7-4acd-a10d-560d7a7e1d48
    target: app:newsfilter,22a90359-073c-4b89-a80f-87b4f1adb4b5
    type: Serving

  - id: rel:nos-rss-serves-newsfilter
    source: svc:nos-rss-feed,83b382b5-0fcc-4aa6-8dbd-3533c485f605
    target: app:newsfilter,22a90359-073c-4b89-a80f-87b4f1adb4b5
    type: Serving
